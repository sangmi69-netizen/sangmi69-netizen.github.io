<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>해금 점검</title>
<style>
  body{background:#12100d;color:#ddd;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:0;padding:12px}
  .frame{margin:10px 0 18px}
  .cap{color:#9bd29b;margin-bottom:4px;font-weight:700}
  iframe{border:1px solid #4a4033;display:block;background:#000}
  #out{white-space:pre-wrap;color:#d8e6c8;border-top:1px solid #333;padding-top:8px}
</style>
</head>
<body>
<div id="out">running…</div>
<script>
var results = {};
function add(k, v){
  results[k] = v;
  window.__test = results;
  document.getElementById('out').textContent = JSON.stringify(results, null, 1);
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function makeFrame(w, h, label){
  var d = document.createElement('div');
  d.className = 'frame';
  d.id = 'wrap-' + label;
  var cap = document.createElement('div');
  cap.className = 'cap';
  cap.textContent = label + '  ' + w + '×' + h;
  var f = document.createElement('iframe');
  f.width = w; f.height = h;
  f.id = 'f-' + label;
  f.src = './index.html?chk=' + label + '&t=' + Date.now();
  d.appendChild(cap); d.appendChild(f);
  document.body.insertBefore(d, document.getElementById('out'));
  return f;
}

function pev(w, type, x, y, id){
  return new w.PointerEvent(type, {
    bubbles:true, cancelable:true, clientX:x, clientY:y,
    pointerId:id, pointerType:'touch', isPrimary:true, button:0, buttons:(type === 'pointerup' ? 0 : 1)
  });
}

async function testFrame(f, name){
  await new Promise(function(res){
    if(f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentWindow.__hg) return res();
    var done = false;
    f.onload = function(){ if(!done){ done = true; res(); } };
    setTimeout(function(){ if(!done){ done = true; res(); } }, 3000);
  });
  await sleep(1000);
  var w = f.contentWindow, doc = f.contentDocument;
  var r = { errs: w.__errs.slice(), ok:true };

  try{
    r.layout = { k:+w.__hg.L.k.toFixed(3), rot:w.__hg.L.rot, land:w.__hg.L.land, W:w.__hg.L.W, H:w.__hg.L.H };
    var lanes = w.__hg.laneRects();
    r.lanes = lanes;
    r.rows = w.__hg.rowCount();
    r.rowPx = lanes.length ? +(Math.max(lanes[0].w, lanes[0].h) / r.rows).toFixed(1) : 0;
    r.notesJung = w.__hg.notes(0).map(function(n){ return n.note + '/' + n.yul + '/' + n.midi; }).join(' ');
    r.notesYu = w.__hg.notes(1).map(function(n){ return n.note + '/' + n.yul + '/' + n.midi; }).join(' ');
    var labels = w.__hg.labels();
    r.labelCount = labels.length;
    r.labelSample = labels.slice(0, 2).concat(labels.slice(8, 10)).map(function(l){ return l.text + '@' + (l.font * w.__hg.L.k).toFixed(1) + 'px'; });

    // 표기 전환
    w.__hg.setOption('label', 'name');
    await sleep(60);
    r.labelAfterName = w.__hg.labels().slice(0, 3).map(function(l){ return l.text; });
    w.__hg.setOption('label', 'yul');

    // 반음계로 바꿔 12행 확인
    w.__hg.setOption('scale', 'ban');
    await sleep(120);
    r.banRows = w.__hg.rowCount();
    r.banLabelCount = w.__hg.labels().length;
    var lr = w.__hg.laneRects()[0]; r.banRowPx = +(Math.max(lr.w, lr.h) / r.banRows).toFixed(1);
    w.__hg.setOption('scale', 'pyeongjo');
    await sleep(120);

    // 첫 터치(오디오 잠금 해제)
    var cover = doc.getElementById('cover');
    if(cover) cover.dispatchEvent(pev(w, 'pointerdown', 10, 10, 5));
    await sleep(700);
    r.coverGone = !doc.getElementById('cover');
    r.audio = w.__hg.audioState();

    // 중현 첫 음 누르기
    var p0 = w.__hg.screen(-100, w.__hg.rowY(0));
    var lane = doc.querySelector('rect.lane[data-lane="0"]');
    lane.dispatchEvent(pev(w, 'pointerdown', p0.x, p0.y, 71));
    await sleep(140);
    r.afterDown = w.__hg.active();

    // 줄을 따라 밀기 (시김새)
    var p2 = w.__hg.screen(-100, w.__hg.rowY(2));
    doc.dispatchEvent(pev(w, 'pointermove', p2.x, p2.y, 71));
    await sleep(100);
    r.afterGlide = w.__hg.active();

    // 가로로 흔들기 (농현)
    var p3 = w.__hg.screen(-100 + 34, w.__hg.rowY(2));
    doc.dispatchEvent(pev(w, 'pointermove', p3.x, p3.y, 71));
    await sleep(100);
    r.afterNong = w.__hg.active();

    doc.dispatchEvent(pev(w, 'pointerup', p3.x, p3.y, 71));
    await sleep(260);
    r.afterUp = w.__hg.active();

    // 유현
    var q0 = w.__hg.screen(100, w.__hg.rowY(3));
    var lane1 = doc.querySelector('rect.lane[data-lane="1"]');
    lane1.dispatchEvent(pev(w, 'pointerdown', q0.x, q0.y, 72));
    await sleep(140);
    r.afterDownYu = w.__hg.active();
    doc.dispatchEvent(pev(w, 'pointerup', q0.x, q0.y, 72));
    await sleep(150);

    // 활 긋기 모드
    w.__hg.setOption('mode', 'bow');
    await sleep(120);
    var b0 = w.__hg.screen(-100, w.__hg.rowY(1));
    doc.querySelector('rect.lane[data-lane="0"]').dispatchEvent(pev(w, 'pointerdown', b0.x, b0.y, 81));
    await sleep(100);
    r.bowSelected = w.__hg.active();
    var pad = w.__hg.screen(-150, 420);
    var pad2 = w.__hg.screen(120, 420);
    var padEl = doc.querySelector('rect.bowpad');
    padEl.dispatchEvent(pev(w, 'pointerdown', pad.x, pad.y, 82));
    await sleep(60);
    doc.dispatchEvent(pev(w, 'pointermove', pad2.x, pad2.y, 82));
    await sleep(180);
    r.bowPlaying = w.__hg.active();
    doc.dispatchEvent(pev(w, 'pointerup', pad2.x, pad2.y, 82));
    doc.dispatchEvent(pev(w, 'pointerup', b0.x, b0.y, 81));
    await sleep(150);
    r.bowAfterUp = w.__hg.active();
    w.__hg.setOption('mode', 'touch');
    await sleep(100);

    r.errs = w.__errs.slice();
  }catch(e){
    r.ok = false;
    r.error = String(e && e.stack || e);
  }
  add(name, r);
  return w;
}

async function audioTest(w){
  var r = {};
  try{
    var m1 = w.__hg.notes(0)[0];   /* 중현 개방현 */
    var m2 = w.__hg.notes(1)[0];   /* 유현 개방현 */
    var b1 = await w.__hg.renderOffline([{ s:0, midi:m1.midi, at:0.02, dur:1.1 }], 1.9);
    var b2 = await w.__hg.renderOffline([{ s:1, midi:m2.midi, at:0.02, dur:1.1 }], 1.9);
    var b3 = await w.__hg.renderOffline([{ s:0, midi:m1.midi + 12, at:0.02, dur:1.1, nong:1 }], 1.9);
    var a1 = w.__hg.analyze(b1), a2 = w.__hg.analyze(b2), a3 = w.__hg.analyze(b3);
    r.jung = { targetHz:+(440*Math.pow(2,(m1.midi-69)/12)).toFixed(1), f0:a1.f0, peak:a1.peak, rms:a1.rms,
               bands:a1.bands, harm:a1.harm, env:a1.blocks };
    r.yu = { targetHz:+(440*Math.pow(2,(m2.midi-69)/12)).toFixed(1), f0:a2.f0, peak:a2.peak, rms:a2.rms,
             bands:a2.bands, harm:a2.harm, env:a2.blocks };
    var b4 = await w.__hg.renderOffline([{ s:0, midi:m1.midi + 12, at:0.02, dur:1.1 }], 1.9);
    var a4 = w.__hg.analyze(b4);
    r.nong = { targetHz:+(440*Math.pow(2,(m1.midi+12-69)/12)).toFixed(1), f0:a3.f0, peak:a3.peak, rms:a3.rms, bands:a3.bands,
               trackOn:a3.track, trackOff:a4.track };
  }catch(e){ r.error = String(e && e.stack || e); }
  add('audio', r);
}

(async function(){
  var f1 = makeFrame(390, 844, 'portrait');
  var f2 = makeFrame(844, 390, 'landscape');
  var f3 = makeFrame(1280, 800, 'desktop');
  var w1 = await testFrame(f1, 'portrait');
  await testFrame(f2, 'landscape');
  await testFrame(f3, 'desktop');
  await audioTest(w1);
  add('done', true);
})();
</script>
</body>
</html>
