<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}iframe{display:block;border:0;background:#000}</style>
<iframe id="f" src="_v4app.html" width="932" height="430"></iframe>
<script>
var q = new URLSearchParams(location.search), s = (q.get('s') || '932x430').split('x');
var f = document.getElementById('f');
f.width = +s[0]; f.height = +s[1];
document.title = 'v4 ' + s[0] + 'x' + s[1];
function tidy(){
  try {
    var d = f.contentDocument; if (!d || !d.head) return;
    if (d.getElementById('__tidy')) return;
    var st = d.createElement('style'); st.id = '__tidy';
    st.textContent = '#intro{display:none!important}#keybar{display:none!important}#toast{display:none!important}';
    d.head.appendChild(st);
  } catch (x) {}
}
f.addEventListener('load', tidy);
[150, 500, 1200, 2500].forEach(function(t){ setTimeout(tidy, t); });
</script>
