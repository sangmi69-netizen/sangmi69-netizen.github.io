<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>버추얼 드럼 · Virtual Drums</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="터치와 키보드로 연주하는 버추얼 드럼">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23c99b52'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23221a10'/%3E%3C/svg%3E">
<style>
:root{--ink:#efe7d8;--dim:#9a9085;--gold:#d9a441}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;width:100%;height:100%;
  background:#000;color:var(--ink);
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  touch-action:none;
}
body{position:fixed;inset:0}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none;border:0}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- 무대 ---------- */
#stage{
  position:absolute;inset:0;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 82% at 50% 78%,#0d0d0d 0%,#060606 58%,#000 100%);
}
#scene{
  position:absolute;left:50%;top:50%;
  width:min(100vw,calc(100dvh * 16 / 9));
  height:min(calc(100vw * 9 / 16),100dvh);
  transform:translate(-50%,-50%);
  overflow:hidden;isolation:isolate;touch-action:none;
}
#scene::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(125% 105% at 50% 52%,rgba(0,0,0,0) 58%,rgba(0,0,0,.34) 84%,rgba(0,0,0,.72) 100%);
}
@media (orientation:portrait) and (max-width:900px){
  #scene{width:100dvh;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}
}
#kit{position:absolute;left:50%;bottom:var(--kitbottom,0%);transform:translateX(-50%);width:var(--kitscale,100%);height:auto;display:block}

/* ---------- 심벌 ---------- */
.pad{position:absolute;touch-action:none}
.pad.drum{z-index:2}
.pad.cym{z-index:3}
.pad.cym{
  left:var(--x);top:var(--y);width:var(--w);aspect-ratio:1/1;
  transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scaleY(.6);
  border-radius:50%;
}
.pad.cym .disc{
  position:absolute;inset:0;border-radius:50%;
  background-image:var(--img);background-size:100% 100%;background-repeat:no-repeat;
  transform-origin:50% 50%;
  will-change:transform,filter;pointer-events:none;
  filter:brightness(var(--b,1)) saturate(var(--sat,1)) hue-rotate(var(--hue,0deg));
}
.pad.cym.hit .disc{animation:cymWob .34s cubic-bezier(.18,.72,.28,1) both}
@keyframes cymWob{
  0%{transform:scale(1) rotate(0deg)}
  16%{transform:scale(1.03) rotate(.6deg);filter:brightness(calc(var(--b,1) * 1.5)) saturate(calc(var(--sat,1) * 1.06)) hue-rotate(var(--hue,0deg))}
  52%{transform:scale(.996) rotate(-.32deg);filter:brightness(calc(var(--b,1) * 1.14)) saturate(var(--sat,1)) hue-rotate(var(--hue,0deg))}
  100%{transform:scale(1) rotate(0deg);filter:brightness(var(--b,1)) saturate(var(--sat,1)) hue-rotate(var(--hue,0deg))}
}
.pad.cym .openZone{
  position:absolute;left:9%;right:9%;bottom:5%;height:33%;
  border-radius:0 0 50% 50%/0 0 92% 92%;pointer-events:auto;
}

/* ---------- 드럼(사진 조각이 그대로 움직입니다) ---------- */
.pad.drum{
  left:var(--x);top:var(--y);width:var(--w);height:var(--h);
  border-radius:50%;overflow:hidden;transform:translate(-50%,-50%);
}
.pad.drum .layer{position:absolute;left:0;top:0;will-change:transform,filter}
.pad.drum.wide .flash{inset:auto;left:50%;top:50%;width:36%;height:26%;margin:-13% 0 0 -18%}
.pad.drum .flash{
  position:absolute;inset:-5%;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 44%,rgba(255,255,255,.32),rgba(255,255,255,.05) 46%,rgba(255,255,255,0) 68%);
}
.pad.drum.hit .layer{animation:drumHit .19s ease-out both}
.pad.drum.hit .flash{animation:drumFlash .2s ease-out both}
@keyframes drumHit{
  0%{transform:scale(1) translateY(0);filter:brightness(1)}
  22%{transform:scale(1.034) translateY(.6%);filter:brightness(1.2) contrast(1.03)}
  100%{transform:scale(1) translateY(0);filter:brightness(1)}
}
@keyframes drumFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
/* 검증용: ?slow 로 타격 애니메이션을 느리게 볼 수 있습니다 */
.slow .pad.drum.hit .layer{animation-duration:9s !important}
.slow .pad.drum.hit .flash{animation-duration:9s !important}
.slow .pad.cym.hit .disc{animation-duration:11s !important}

/* ---------- 특수 구역(라이드 벨 · 스네어 림 · 하이햇 페달) ---------- */
.zone{position:absolute;pointer-events:auto;z-index:2}
.pad.cym .zone-bell{left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%}
.pad.drum .zone-head{left:1%;top:1%;width:98%;height:57%;border-radius:50%}
.mark{position:absolute;pointer-events:none;border:1px dashed rgba(255,255,255,.42);border-radius:50%;z-index:3;display:none}
.mark i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;
  font-size:clamp(9px,0.78vw,13px);letter-spacing:.04em;color:rgba(255,255,255,.75);
  background:rgba(0,0,0,.45);padding:1px 7px;border-radius:999px;white-space:nowrap}
.mark.sq{border-radius:10px}
body.zones .mark{display:block}
#pedal{
  position:absolute;left:13%;top:70.5%;width:13%;height:6.6%;transform:translate(-50%,-50%);
  border:1px dashed rgba(255,255,255,.32);border-radius:10px;z-index:4;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.03);touch-action:none;
}
#pedal i{font-style:normal;font-size:clamp(9px,0.8vw,13px);letter-spacing:.06em;color:rgba(255,255,255,.7)}
#pedal.hit{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.6)}

/* ---------- 메뉴 버튼 ---------- */
#menuBtn{
  position:absolute;left:14px;top:12px;z-index:40;
  width:42px;height:42px;padding:0;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
  background:rgba(20,20,20,.45);border:1px solid rgba(255,255,255,.13);border-radius:10px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);touch-action:manipulation;
}
#menuBtn i{display:block;width:19px;height:2px;background:#e8e2d6;border-radius:2px;opacity:.9}
#menuBtn:hover{background:rgba(52,52,52,.62)}

/* ---------- 하단 키 안내 ---------- */
#keybar{
  position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;
  display:flex;flex-direction:column;gap:3px;align-items:center;padding:6px 16px;border-radius:14px;
  background:rgba(10,10,10,.42);border:1px solid rgba(255,255,255,.08);
  font-size:12px;color:#b9b0a4;letter-spacing:.02em;white-space:nowrap;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
#keybar .row{display:flex;gap:14px;align-items:center}
#keybar .sub{font-size:11px;color:#8f877b;letter-spacing:.01em}
#keybar b{color:#efe7d8;font-weight:600}
#keybar.off{display:none}
@media (max-width:900px){#keybar{display:none}}

/* ---------- 시작 화면 ---------- */
#intro{
  position:absolute;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(circle at 50% 45%,rgba(12,12,12,.74),rgba(3,3,3,.94) 70%);
  text-align:center;padding:24px;
}
#intro h1{margin:0;font-size:clamp(22px,3.4vw,40px);letter-spacing:.02em;font-weight:700;color:#f6efe2;text-shadow:0 2px 24px rgba(0,0,0,.8)}
#intro h1 span{color:var(--gold)}
#intro p{margin:0;font-size:clamp(12px,1.45vw,16px);color:#b6ada0;line-height:1.85}
#intro kbd{display:inline-block;min-width:20px;padding:1px 6px;margin:0 1px;border:1px solid #4a443b;border-bottom-width:2px;border-radius:5px;background:#1b1a17;color:#e6ded1;font:inherit;font-size:.9em}
#startBtn{
  margin-top:4px;padding:13px 44px;border-radius:12px;border:1px solid #7d5f28;
  background:linear-gradient(#2a2419,#191510);color:#f2c86b;
  font-size:clamp(15px,1.8vw,19px);font-weight:700;letter-spacing:.16em;
  box-shadow:0 0 24px rgba(217,164,65,.18) inset,0 6px 20px rgba(0,0,0,.5);
}
#startBtn:active{transform:translateY(1px)}
#introNote{margin-top:2px;font-size:11.5px;color:#7d766c}
#intro.hide{display:none}

/* ---------- 메뉴 ---------- */
#menu{
  position:absolute;inset:0;z-index:50;display:none;
  background:rgba(5,5,5,.85);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  flex-direction:column;align-items:center;padding:min(4vh,34px) 4vw;touch-action:none;
}
#menu.on{display:flex}
#menuTabs{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;width:min(1080px,94%);margin-bottom:min(2.6vh,22px)}
#menuTabs button{
  flex:1 1 0;min-width:104px;padding:11px 8px;background:transparent;border:0;border-radius:8px;
  color:#a79e91;font-size:clamp(13px,1.5vw,19px);font-weight:600;letter-spacing:.03em;
}
#menuTabs button.on{background:#242321;color:#f7f1e6}
#menuGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:min(1.4vh,12px);width:min(1080px,94%)}
#menuGrid[hidden],#menuVol[hidden]{display:none}
@media (max-width:760px){#menuGrid{grid-template-columns:repeat(4,1fr)}}
#menuGrid button{
  aspect-ratio:1.55/1;border-radius:9px;background:#232221;border:1px solid #2f2d2a;
  color:#8f877b;font-size:clamp(15px,1.9vw,24px);font-weight:600;
  display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;
}
#menuGrid button.on{background:#3a3733;color:#fdf7ec;border-color:#57524a}
#menuClose{
  margin-top:auto;padding:10px 46px;border-radius:9px;background:transparent;border:2px solid #a8761f;
  color:#ff6a3d;font-size:clamp(14px,1.7vw,20px);font-weight:700;letter-spacing:.1em;
  text-shadow:0 0 12px rgba(255,60,20,.5);
}
#menuVol{width:min(1080px,94%);display:flex;flex-direction:column;gap:16px;color:#b6ada0;font-size:14px}
#menuVol .row{display:flex;align-items:center;gap:16px}
#menuVol input[type=range]{flex:1;accent-color:#c99b52;height:26px}
#menuVol label.tg{display:flex;align-items:center;gap:10px;cursor:pointer}
#menuVol input[type=checkbox]{width:18px;height:18px;accent-color:#c99b52}
#menuVol .hint{font-size:12.5px;line-height:1.9;color:#8b8377}
#menuVol b{color:#d8cfc1}
#volVal{width:52px;text-align:right;color:#e9e1d4;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage"><div id="scene"></div></div>

<div id="menuBtn" title="설정" aria-label="설정"><i></i><i></i><i></i></div>
<div id="keybar">
  <div class="row">
    <span><b>Space</b> 킥</span>
    <span><b>F</b> 스네어 · <b>G</b> 크로스스틱</span>
    <span><b>Z</b>/<b>X</b>/<b>C</b> 하이·미들·플로어</span>
    <span><b>A</b> 닫힘 · <b>S</b> 열림 · <b>D</b> 페달</span>
    <span><b>Q</b>/<b>W</b> 크래시 · <b>E</b> 라이드 · <b>R</b> 벨</span>
  </div>
  <div class="row sub">라이드 가운데 = 벨 · 스네어 테두리 = 크로스스틱 · 하이햇 아래 테두리 = 열림</div>
</div>


<div id="intro">
  <h1>버추얼 <span>드럼</span></h1>
  <p>5기통 드럼입니다. 화면의 드럼과 심벌을 손가락으로 눌러 연주하세요.<br>
     두 개 이상을 동시에 눌러도 그대로 함께 울립니다.<br>
     키보드 — <kbd>Space</kbd> 킥 · <kbd>F</kbd> 스네어 · <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd> 하이·미들·플로어 탐 · <kbd>Q</kbd><kbd>W</kbd> 크래시 · <kbd>E</kbd> 라이드</p>
  <button id="startBtn">시 작</button>
  <div id="introNote">이어폰이나 스피커로 들으면 더 좋습니다</div>
</div>

<div id="menu">
  <div id="menuTabs"></div>
  <div id="menuGrid"></div>
  <div id="menuVol" hidden></div>
  <button id="menuClose">닫 기</button>
</div>

"use strict";
/* 검증용 상태 훅 */
window.__vd = {hits:[], errors:[], peak:0, ready:false, ctx:"none", buffers:{}, multi:0};

var KIT = {scale:1.18, bottom:-0.10};
var DRUMS_PX = [

];
/* 사진 좌표 -> 무대 % (무대는 16:9, 사진은 1536x1024) */
function pxToScene(px, py){
  var W = 1536, H = 864;
  var dw = W * KIT.scale, dh = dw * (1024/1536);
  var left = (W - dw) / 2;
  var top = H * (1 - KIT.bottom) - dh;
  return {x: (left + px*KIT.scale)/W*100, y: (top + py*KIT.scale)/H*100};
}
var DRUMS = DRUMS_PX.map(function(d){
  var c = pxToScene(d.cx, d.cy);
  var p1 = pxToScene(d.cx - d.hw, d.cy - d.hh), p2 = pxToScene(d.cx + d.hw, d.cy + d.hh);
  return {id:d.id, x:c.x, y:c.y, w:(p2.x - p1.x), h:(p2.y - p1.y), label:d.label, key:d.key, zone:d.zone, tune:d.tune, wide:d.wide, pan:d.pan, head:d.head};
});

/* ---------- 소리 만들기 (스튜디오 드럼 모델) ---------- */
var SR = 44100, SOUND = null, AC = null, master = null, analyser = null, anaData = null;
var drumBus = null, comp = null, reverb = null, wetBus = null;

function softClip(k){
  var n = 2048, c = new Float32Array(n), t = Math.tanh(k);
  for(var i=0;i<n;i++){ var x = i*2/n-1; c[i] = Math.tanh(x*k)/t; }
  return c;
}
function noiseBuf(oc, dur){
  var len = Math.ceil(oc.sampleRate*dur), b = oc.createBuffer(1, len, oc.sampleRate), d = b.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
  return b;
}
function offline(dur, fn){
  try{
    var oc = new OfflineAudioContext(1, Math.ceil(SR*dur), SR);
    fn(oc);
    return oc.startRendering();
  }catch(e){
    return Promise.reject(e);
  }
}
function env(g, t0, peak, attack, decay){
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t0+attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+attack+decay);
}
function filt(oc, type, freq, q){
  var f = oc.createBiquadFilter();
  f.type = type; f.frequency.value = freq;
  if(q != null) f.Q.value = q;
  return f;
}

/* ===== 킥: 비터 클릭 + 단단한 펀치 + 깊은 서브 ===== */
function mkKick(p){
  var dur = p.decay + .16;
  return offline(dur, function(oc){
    var t = 0;
    /* 서브 바디 */
    var sub = oc.createOscillator(); sub.type = "sine";
    sub.frequency.setValueAtTime(p.f0, t);
    sub.frequency.exponentialRampToValueAtTime(p.f1, t + p.sweep);
    sub.frequency.exponentialRampToValueAtTime(p.f1*0.96, t + dur);
    var gs = oc.createGain(); env(gs, t, 1, .005, p.decay);
    var ws = oc.createWaveShaper(); ws.curve = softClip(1.5); ws.oversample = "2x";
    var hp = filt(oc, "highpass", 28);
    sub.connect(gs); gs.connect(ws); ws.connect(hp); hp.connect(oc.destination);
    sub.start(t); sub.stop(dur);
    /* 중저음 펀치 */
    var body = oc.createOscillator(); body.type = "triangle";
    body.frequency.setValueAtTime(p.f0*2.3, t);
    body.frequency.exponentialRampToValueAtTime(p.f1*1.7, t + .05);
    var gb = oc.createGain(); env(gb, t, p.punch, .002, .10);
    var lp = filt(oc, "lowpass", 1000, .7);
    body.connect(gb); gb.connect(lp); lp.connect(oc.destination);
    body.start(t); body.stop(.32);
    /* 비터 클릭 2~4kHz */
    var n = oc.createBufferSource(); n.buffer = noiseBuf(oc,.05);
    var bp = filt(oc, "bandpass", p.clickF, 0.9);
    var gc = oc.createGain(); env(gc, t, p.click*1.6, .0006, .016);
    n.connect(bp); bp.connect(gc); gc.connect(oc.destination); n.start(t);
    /* 비터가 헤드를 때리는 넓은 대역 */
    var n1 = oc.createBufferSource(); n1.buffer = noiseBuf(oc,.04);
    var hp1 = filt(oc, "highpass", 1100);
    var g1 = oc.createGain(); env(g1, t, p.click*0.85, .0006, .011);
    n1.connect(hp1); hp1.connect(g1); g1.connect(oc.destination); n1.start(t);
    /* 나무 비터의 짧은 '톡' */
    var tk = oc.createOscillator(); tk.type = "sine";
    tk.frequency.setValueAtTime(1600, t);
    tk.frequency.exponentialRampToValueAtTime(520, t + .022);
    var gt = oc.createGain(); env(gt, t, p.click*0.35, .0008, .018);
    tk.connect(gt); gt.connect(oc.destination); tk.start(t); tk.stop(.08);
  });
}

/* ===== 스네어: 헤드 펀치 + 와이어 잔향 ===== */
function mkSnare(p){
  var dur = p.decay + .18;
  return offline(dur, function(oc){
    var t = 0;
    [[p.f1, 1, .62], [p.f2, .5, .42]].forEach(function(v, i){
      var o = oc.createOscillator(); o.type = i ? "triangle" : "sine";
      o.frequency.setValueAtTime(v[0], t);
      o.frequency.exponentialRampToValueAtTime(v[0]*0.74, t + p.decay*.5);
      var g = oc.createGain(); env(g, t, p.amp*v[1], .002, p.decay*v[2]);
      o.connect(g); g.connect(oc.destination); o.start(t); o.stop(dur);
    });
    /* 헤드 어택 */
    var n0 = oc.createBufferSource(); n0.buffer = noiseBuf(oc,.07);
    var bp0 = filt(oc, "bandpass", 1750, .9);
    var g0 = oc.createGain(); env(g0, t, p.amp*.55, .001, .03);
    n0.connect(bp0); bp0.connect(g0); g0.connect(oc.destination); n0.start(t);
    /* 스네어 와이어: 두 대역 + 살짝 떨림 */
    [[5200, .55, 1.0], [7600, .36, .8], [3400, .24, 1.15]].forEach(function(w, i){
      var n = oc.createBufferSource(); n.buffer = noiseBuf(oc, dur);
      var hp = filt(oc, "highpass", w[0]*0.5);
      var bp = filt(oc, "bandpass", w[0], 0.85);
      var g = oc.createGain(); env(g, t, p.amp*w[1], .002, p.decay*w[2]);
      n.connect(hp); hp.connect(bp); bp.connect(g); g.connect(oc.destination);
      n.start(t);
      if(i === 0){
        var lfo = oc.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 43;
        var lg = oc.createGain(); lg.gain.value = p.amp*w[1]*0.35;
        lfo.connect(lg); lg.connect(g.gain); lfo.start(t); lfo.stop(dur);
      }
    });
  });
}

/* ===== 탐: 껍질 공명 + 피치 드롭 ===== */
function mkTom(p){
  var dur = p.decay + .12;
  return offline(dur, function(oc){
    var t = 0;
    [[1, 1, 1], [1.58, .30, .55], [2.38, .12, .35], [3.1, .05, .22]].forEach(function(h, i){
      var o = oc.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(p.f*h[0]*1.34, t);
      o.frequency.exponentialRampToValueAtTime(p.f*h[0], t + .07);
      o.frequency.exponentialRampToValueAtTime(p.f*h[0]*0.984, t + dur);
      var g = oc.createGain(); env(g, t, p.amp*h[1], .003, p.decay*h[2]);
      o.connect(g); g.connect(oc.destination); o.start(t); o.stop(dur);
    });
    /* 헤드 어택 */
    var n = oc.createBufferSource(); n.buffer = noiseBuf(oc,.05);
    var lp = filt(oc, "lowpass", 2200, .8);
    var g2 = oc.createGain(); env(g2, t, p.amp*.22, .001, .028);
    n.connect(lp); lp.connect(g2); g2.connect(oc.destination); n.start(t);
  });
}

/* ===== 크로스 스틱: 나무 림 '톡' ===== */
function mkCrossStick(p){
  return offline(.3, function(oc){
    var t = 0;
    [[p.f1||780, .85, .045], [(p.f1||780)*2.02, .30, .03]].forEach(function(v, i){
      var o = oc.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(v[0]*(p.tune||1), t);
      o.frequency.exponentialRampToValueAtTime(v[0]*(p.tune||1)*0.9, t + .04);
      var g = oc.createGain(); env(g, t, p.amp*v[1], .0008, v[2]);
      o.connect(g); g.connect(oc.destination); o.start(t); o.stop(.3);
    });
    var n = oc.createBufferSource(); n.buffer = noiseBuf(oc,.1);
    var bp = filt(oc, "bandpass", p.bp||1900, 3.6);
    var g2 = oc.createGain(); env(g2, t, p.amp*.80, .0006, .024);
    n.connect(bp); bp.connect(g2); g2.connect(oc.destination); n.start(t);
    var n2 = oc.createBufferSource(); n2.buffer = noiseBuf(oc,.22);
    var hp = filt(oc, "highpass", 4200);
    var g3 = oc.createGain(); env(g3, t, p.amp*.08, .003, .075);
    n2.connect(hp); hp.connect(g3); g3.connect(oc.destination); n2.start(t);
  });
}

/* ===== 심벌(크래시·라이드·차이나·하이햇) ===== */
function mkCym(p){
  var dur = p.decay + .1;
  return offline(dur, function(oc){
    var t = 0;
    var n = oc.createBufferSource(); n.buffer = noiseBuf(oc, dur);
    var hp = filt(oc, "highpass", p.hp);
    var bp = filt(oc, "bandpass", p.bp, p.q || .8);
    var g = oc.createGain(); env(g, t, p.amp, .003, p.decay);
    n.connect(hp); hp.connect(bp); bp.connect(g); g.connect(oc.destination); n.start(t);
    /* 비화성 금속 배음 */
    [317, 451, 563, 712, 893, 1042, 1271].forEach(function(f, i){
      var o = oc.createOscillator(); o.type = "square";
      o.frequency.value = f*p.tune*(1 + i*0.004);
      var bp2 = filt(oc, "bandpass", f*p.tune*3.2, 6 + i);
      var g2 = oc.createGain();
      env(g2, t, (p.metalAmp||.05)/(1 + i*.5), .004, p.decay*(.95 - i*.055));
      o.connect(bp2); bp2.connect(g2); g2.connect(oc.destination); o.start(t); o.stop(dur);
    });
    if(p.bell){
      [1, 1.51, 2.32, 3.12].forEach(function(m, i){
        var o = oc.createOscillator(); o.type = "sine"; o.frequency.value = 1010*m*p.tune;
        var g2 = oc.createGain(); env(g2, t, p.bell/(1 + i*.8), .0015, (p.bellDecay||.4)*(1 - i*.12));
        o.connect(g2); g2.connect(oc.destination); o.start(t); o.stop(dur);
      });
    }
  });
}

/* ===== 라이드 벨 ===== */
function mkBell(p){
  return offline(1.35, function(oc){
    var t = 0;
    [[1, 1, 1], [1.52, .55, .75], [2.34, .38, .55], [3.14, .22, .4], [4.1, .12, .28]].forEach(function(v, i){
      var o = oc.createOscillator(); o.type = "sine";
      o.frequency.value = 1030*v[0]*(p.tune||1);
      var g = oc.createGain(); env(g, t, p.amp*v[1], .0012, p.decay*v[2]);
      o.connect(g); g.connect(oc.destination); o.start(t); o.stop(1.35);
    });
    var n = oc.createBufferSource(); n.buffer = noiseBuf(oc,.09);
    var bp = filt(oc, "bandpass", 4800, 2.4);
    var g2 = oc.createGain(); env(g2, t, p.amp*.35, .001, .055);
    n.connect(bp); bp.connect(g2); g2.connect(oc.destination); n.start(t);
  });
}

/* ===== 하이햇 풋 페달 '칙' ===== */
function mkPedal(p){
  return offline(.34, function(oc){
    var t = 0;
    var n = oc.createBufferSource(); n.buffer = noiseBuf(oc,.2);
    var hp = filt(oc, "highpass", 4600);
    var bp = filt(oc, "bandpass", 8200, .9);
    var g = oc.createGain(); env(g, t, p.amp*.55, .0015, .05);
    n.connect(hp); hp.connect(bp); bp.connect(g); g.connect(oc.destination); n.start(t);
    var o = oc.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(165, t);
    o.frequency.exponentialRampToValueAtTime(92, .09);
    var g2 = oc.createGain(); env(g2, t, p.amp*.34, .002, .09);
    o.connect(g2); g2.connect(oc.destination); o.start(t); o.stop(.34);
  });
}

function norm(buf, target){
  var d = buf.getChannelData(0), peak = 0, i, a;
  for(i=0;i<d.length;i++){ a = Math.abs(d[i]); if(a > peak) peak = a; }
  if(peak > 0.0001){ var k = target/peak; for(i=0;i<d.length;i++) d[i] *= k; }
  return buf;
}

function buildSounds(){
  var out = {kick:[], snare:[], tom:[], crash:[], ride:[], china:[], hihat:[], hihatOpen:[],
             rideBell:[], crossStick:[], pedal:[]};
  var jobs = [];
  KICKS.forEach(function(p){ jobs.push(mkKick(p).then(function(b){ out.kick.push(norm(b,.95)); })); });
  SNARES.forEach(function(p){ jobs.push(mkSnare(p).then(function(b){ out.snare.push(norm(b,.88)); })); });
  TOMS.forEach(function(p){ jobs.push(mkTom(p).then(function(b){ out.tom.push(norm(b,.90)); })); });
  CYMV.forEach(function(p){
    jobs.push(mkCym(Object.assign({}, p, {decay:1.9, amp:.50, bell:.05, bellDecay:.5}))
      .then(function(b){ out.crash.push(norm(b,.80)); }));
    jobs.push(mkCym(Object.assign({}, p, {decay:1.25, amp:.44, bell:.09, bellDecay:.45, hp:5000, bp:7400}))
      .then(function(b){ out.ride.push(norm(b,.74)); }));
    jobs.push(mkCym(Object.assign({}, p, {decay:1.0, amp:.52, hp:2000, bp:3200, q:1.5, metalAmp:.085, tune:.8}))
      .then(function(b){ out.china.push(norm(b,.76)); }));
    jobs.push(mkCym(Object.assign({}, p, {decay:.055, amp:.40, hp:6800, bp:9400, metalAmp:.028}))
      .then(function(b){ out.hihat.push(norm(b,.56)); }));
    jobs.push(mkCym(Object.assign({}, p, {decay:.36, amp:.44, hp:5800, bp:8600, metalAmp:.036}))
      .then(function(b){ out.hihatOpen.push(norm(b,.56)); }));
  });
  jobs.push(mkBell({decay:.95, amp:.60, tune:1.00}).then(function(b){ out.rideBell.push(norm(b,.82)); }));
  jobs.push(mkBell({decay:.78, amp:.58, tune:1.16}).then(function(b){ out.rideBell.push(norm(b,.80)); }));
  jobs.push(mkCrossStick({amp:.95, bp:1900}).then(function(b){ out.crossStick.push(norm(b,.88)); }));
  jobs.push(mkCrossStick({amp:.92, bp:2400, tune:1.05}).then(function(b){ out.crossStick.push(norm(b,.88)); }));
  jobs.push(mkPedal({amp:.85}).then(function(b){ out.pedal.push(norm(b,.74)); }));
  jobs.push(mkPedal({amp:.80}).then(function(b){ out.pedal.push(norm(b,.72)); }));
  var safe = jobs.map(function(p){
    return p.catch(function(e){ window.__vd.errors.push("sound: " + (e && e.message ? e.message : e)); return null; });
  });
  return Promise.all(safe).then(function(){
    SOUND = out;
    window.__vd.buffers = Object.keys(out).reduce(function(a,k){ a[k] = out[k].length; return a; }, {});
    window.__vd.S = out;
    window.__vd.soundsReady = true;
  });
}

/* ---------- 스튜디오 룸 리버브(임펄스 응답을 직접 만듭니다) ---------- */
function makeIR(sec, decay){
  var len = Math.floor(SR*sec);
  var buf = AC.createBuffer(2, len, SR);
  for(var ch=0; ch<2; ch++){
    var d = buf.getChannelData(ch);
    for(var i=0;i<len;i++){
      var t = i/len;
      d[i] = (Math.random()*2-1) * Math.pow(1-t, decay) * (i < SR*0.004 ? 0.35 : 1);
    }
    [0.007, 0.013, 0.019, 0.027, 0.037, 0.049].forEach(function(tt, k){
      var idx = Math.floor(tt*SR*(ch ? 1.11 : 1));
      if(idx < len) d[idx] += (ch ? -1 : 1) * 0.55 * Math.pow(1 - tt/sec, decay) * (1 - k*0.12);
    });
    var prev = 0;
    for(var j=0;j<len;j++){ prev = prev*0.62 + d[j]*0.38; d[j] = prev; }
  }
  return buf;
}

/* ---------- 오디오 출력(마스터 컴프 + 룸 리버브) ---------- */
function initAudio(){
  if(AC) return AC;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return null;
  AC = new Ctx({latencyHint:"interactive"});
  master = AC.createGain(); master.gain.value = state.vol;
  comp = AC.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 3;
  comp.attack.value = .004; comp.release.value = .16;
  drumBus = AC.createGain(); drumBus.gain.value = 0.95;
  analyser = AC.createAnalyser(); analyser.fftSize = 2048; anaData = new Float32Array(analyser.fftSize);
  var makeup = AC.createGain(); makeup.gain.value = 1.35;
  drumBus.connect(comp); comp.connect(makeup); makeup.connect(master);
  master.connect(analyser); analyser.connect(AC.destination);
  try{
    reverb = AC.createConvolver(); reverb.buffer = makeIR(1.5, 2.6);
    wetBus = AC.createGain(); wetBus.gain.value = 0.30;
    reverb.connect(wetBus); wetBus.connect(makeup);
  }catch(e){ reverb = null; }
  try{ var b = AC.createBuffer(1,1,AC.sampleRate), s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0); }catch(e){}
  window.__vd.ctx = AC.state;
  return AC;
}
function resumeAudio(){
  initAudio();
  if(!AC) return;
  if(AC.state !== "running") AC.resume().then(function(){ window.__vd.ctx = AC.state; }, function(){});
  window.__vd.ctx = AC.state;
}

var peakRAF = 0;
function measurePeak(){
  if(!analyser) return;
  cancelAnimationFrame(peakRAF);
  var n = 0;
  function tick(){
    analyser.getFloatTimeDomainData(anaData);
    var p = 0, a;
    for(var i=0;i<anaData.length;i++){ a = Math.abs(anaData[i]); if(a > p) p = a; }
    if(p > window.__vd.peak) window.__vd.peak = Math.round(p*1000)/1000;
    if(++n < 22) peakRAF = requestAnimationFrame(tick);
  }
  tick();
}

/* 구역별 공간감(리버브 보냄) */
var SEND = {kick:.05, snare:.16, crossStick:.10, tom:.13, ride:.22, rideBell:.18,
            crash:.26, china:.24, hihat:.12, hihatOpen:.18, pedal:.10};

function bankFor(zone){
  if(!SOUND) return null;
  if(zone === "kick") return SOUND.kick[state.kickV];
  if(zone === "snare") return SOUND.snare[state.snareV];
  if(zone === "tom") return SOUND.tom[state.tomV];
  if(zone === "ride") return SOUND.ride[state.cymV];
  if(zone === "china") return SOUND.china[state.cymV];
  if(zone === "hihat") return SOUND.hihat[state.cymV];
  if(zone === "hihatOpen") return SOUND.hihatOpen[state.cymV];
  if(zone === "rideBell") return SOUND.rideBell[state.cymV];
  if(zone === "crossStick") return SOUND.crossStick[state.snareV];
  if(zone === "pedal") return SOUND.pedal[state.cymV];
  return SOUND.crash[state.cymV];
}

var openHat = null;    /* 울리고 있는 오픈 하이햇 */
function play(zone, tune, gainTrim, pan){
  if(!SOUND || !AC) return;
  var buf = bankFor(zone);
  if(!buf) return;
  if(AC.state !== "running") AC.resume();
  /* 닫힌 하이햇·페달을 치면 울리던 오픈 하이햇을 즉시 멈춥니다(초킹) */
  if((zone === "hihat" || zone === "pedal") && openHat){
    try{
      var now0 = AC.currentTime;
      if(now0 - openHat.t < 4){
        var og = openHat.gain.gain;
        og.cancelScheduledValues(now0);
        og.setValueAtTime(Math.max(og.value, 0.0002), now0);
        og.linearRampToValueAtTime(0.0001, now0 + 0.026);
        openHat.src.stop(now0 + 0.06);
        window.__vd.choke = (window.__vd.choke || 0) + 1;
      }
    }catch(err){}
    openHat = null;
  }
  var src = AC.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = (tune||1) * (0.987 + Math.random()*0.026);
  var g = AC.createGain();
  g.gain.value = (gainTrim==null ? 1 : gainTrim) * (0.93 + Math.random()*0.14);
  var tail = null;
  if(AC.createStereoPanner){
    tail = AC.createStereoPanner();
    tail.pan.value = Math.max(-1, Math.min(1, pan || 0));
  }
  src.connect(g);
  if(tail){ g.connect(tail); tail.connect(drumBus); } else { g.connect(drumBus); }
  if(reverb){
    var s = AC.createGain();
    s.gain.value = (SEND[zone] == null ? .12 : SEND[zone]);
    (tail || g).connect(s); s.connect(reverb);
  }
  src.start(0);
  if(zone === "hihatOpen") openHat = {src:src, gain:g, t:AC.currentTime};
  var rec = {t:Math.round(AC.currentTime*1000)/1000, zone:zone, rate:Math.round(src.playbackRate.value*1000)/1000};
  window.__vd.hits.push(rec);
  if(window.__vd.hits.length > 500) window.__vd.hits.shift();
  measurePeak();
}

/* 사진 조각을 원본 사진과 픽셀 단위로 겹치게 맞춥니다 */
function alignLayers(){

/* ---------- 타격 ---------- */
var active = Object.create(null);
var lastHit = Object.create(null);

function hitPad(el, zoneOverride){
  if(!el) return;
  var id = el.dataset.id;
  var zone = zoneOverride || el.dataset.zone;
  var tune = parseFloat(el.dataset.tune || "1");
  var now = performance.now();
  if(lastHit[id] && now - lastHit[id] < 20) return;
  lastHit[id] = now;
  el.classList.remove("hit");
  void el.offsetWidth;
  el.classList.add("hit");
  clearTimeout(el.__hitTimer);
  var hold = document.documentElement.classList.contains("slow") ? 9000 : 240;
  el.__hitTimer = setTimeout(function(){ el.classList.remove("hit"); }, hold);
  var trim = zone === "kick" ? 1 : (zone === "snare" ? .96 :
             (zone === "crossStick" ? .95 : (zone === "rideBell" ? .88 : .9)));
  var pan = parseFloat(el.dataset.pan || "0");
  play(zone, tune, trim, pan);
  if(zone === "pedal" && pads.hihat){
    var h = pads.hihat;
    h.classList.remove("hit"); void h.offsetWidth; h.classList.add("hit");
    clearTimeout(h.__hitTimer);
    h.__hitTimer = setTimeout(function(){ h.classList.remove("hit"); }, 240);
  }
}
function padFromNode(node, stopAt){
  while(node && node !== stopAt){
    if(node.classList && node.classList.contains("pad")) return node;
    node = node.parentElement;
  }
  return null;
}
function padFromPoint(x, y){
  var el = document.elementFromPoint(x, y);
  return padFromNode(el, document.body);
}
function zoneFromNode(node){
  if(node && node.dataset && node.dataset.zone) return node.dataset.zone;
  return null;
}

scene.addEventListener("pointerdown", function(e){
  var padEl = padFromNode(e.target, scene);
  if(!padEl) return;
  if(e.cancelable) e.preventDefault();
  resumeAudio();
  active[e.pointerId] = padEl.dataset.id;
  var n = Object.keys(active).length;
  window.__vd.pointerCount = n;
  if(n > 1) window.__vd.multi = n;
  hitPad(padEl, zoneFromNode(e.target));
  try{ padEl.setPointerCapture(e.pointerId); }catch(err){}
}, {passive:false});

scene.addEventListener("pointermove", function(e){
  if(!(e.pointerId in active)) return;
  if(e.pointerType === "mouse" && e.buttons === 0) return;
  var el = padFromPoint(e.clientX, e.clientY);
  if(!el) return;
  if(active[e.pointerId] === el.dataset.id) return;
  active[e.pointerId] = el.dataset.id;
  hitPad(el, null);
}, {passive:true});

function release(e){
  if(e.pointerId in active) delete active[e.pointerId];
  window.__vd.pointerCount = Object.keys(active).length;
}

scene.addEventListener("lostpointercapture", release);
scene.addEventListener("touchstart", function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});

/* ---------- 키보드 ---------- */
var KEYS = {};
CYMS.concat(DRUMS).forEach(function(i){
  if(i.key) KEYS[i.key.length === 1 ? "Key"+i.key : i.key] = {pad:i.id, zone:null};
});
KEYS["Space"] = {pad:"kick", zone:null};
KEYS["KeyF"] = {pad:"snare", zone:"snare"};          /* 스네어 헤드 */
KEYS["KeyG"] = {pad:"snare", zone:"crossStick"};     /* 크로스 스틱 */
KEYS["KeyA"] = {pad:"hihat", zone:"hihat"};          /* 닫힘 */
KEYS["KeyS"] = {pad:"hihat", zone:"hihatOpen"};      /* 열림 */
KEYS["KeyD"] = {pad:"pedal", zone:"pedal"};          /* 풋 페달(초킹) */
KEYS["KeyE"] = {pad:"ride",  zone:"ride"};           /* 라이드 보우 */
KEYS["KeyR"] = {pad:"ride",  zone:"rideBell"};       /* 라이드 벨 */
var held = Object.create(null);

window.addEventListener("keydown", function(e){
  if(e.repeat){ if(KEYS[e.code]) e.preventDefault(); return; }
  var k = KEYS[e.code];
  if(!k) return;
  e.preventDefault();
  if(held[e.code]) return;
  held[e.code] = 1;
  resumeAudio();
  hitPad(pads[k.pad], k.zone);
}, {capture:true});
window.addEventListener("keyup", function(e){ if(held[e.code]) delete held[e.code]; }, {capture:true});
window.addEventListener("blur", function(){ held = Object.create(null); active = Object.create(null); });

/* ---------- 메뉴 ---------- */
var state = {vol:0.9, kickV:0, snareV:0, tomV:0, cymV:0, keybar:true, tab:"kick"};
var TABS = [
  {id:"kick",  name:"킥 소리",   items:["1 딥","2 록","3 펀치","4 재즈"]},
  {id:"snare", name:"스네어 소리", items:["1 타이트","2 팻","3 재즈","4 크리스프"]},
  {id:"tom",   name:"탐 소리",   items:["1 클리어","2 팻","3 재즈"]},
  {id:"cym",   name:"심벌 소리",  items:["1 브라이트","2 다크"]},
  {id:"set",   name:"설정",      items:[]}
];
var menuTabs = document.getElementById("menuTabs");
var menuGrid = document.getElementById("menuGrid");
var menuVol  = document.getElementById("menuVol");

TABS.forEach(function(t){
  var b = document.createElement("button");
  b.textContent = t.name; b.dataset.tab = t.id;
  b.addEventListener("click", function(e){ e.preventDefault(); state.tab = t.id; renderMenu(); });
  menuTabs.appendChild(b);
});
function renderMenu(){
  [].forEach.call(menuTabs.children, function(b){ b.classList.toggle("on", b.dataset.tab === state.tab); });
  var isSet = state.tab === "set";
  menuGrid.hidden = isSet; menuVol.hidden = !isSet;
  if(isSet) return;
  menuGrid.innerHTML = "";
  var tab = TABS.filter(function(t){ return t.id === state.tab; })[0];
  var cur = {kick:"kickV", snare:"snareV", tom:"tomV", cym:"cymV"}[state.tab];
  tab.items.forEach(function(name, i){
    var b = document.createElement("button");
    b.textContent = name;
    if(state[cur] === i) b.classList.add("on");
    b.addEventListener("click", function(e){
      e.preventDefault();
      state[cur] = i;
      renderMenu();
      resumeAudio();
      play({kick:"kick", snare:"snare", tom:"tom", cym:"ride"}[state.tab], state.tab === "tom" ? 1.1 : 1, .9);
    });
    menuGrid.appendChild(b);
  });
}
(function buildSettings(){
  var row1 = document.createElement("div"); row1.className = "row";
  var lb = document.createElement("span"); lb.textContent = "전체 음량"; lb.style.minWidth = "64px";
  var range = document.createElement("input");
  range.type = "range"; range.min = "0"; range.max = "100"; range.value = String(Math.round(state.vol*100));
  var val = document.createElement("span"); val.id = "volVal"; val.textContent = range.value + "%";
  range.addEventListener("input", function(){
    state.vol = (+range.value)/100; val.textContent = range.value + "%";
    if(master) master.gain.value = state.vol;
    try{ localStorage.setItem("vd_vol", String(state.vol)); }catch(e){}
  });
  row1.appendChild(lb); row1.appendChild(range); row1.appendChild(val);

  var row2 = document.createElement("div"); row2.className = "row";
  var lab = document.createElement("label"); lab.className = "tg";
  var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = state.keybar;
  cb.addEventListener("change", function(){
    state.keybar = cb.checked;
    document.getElementById("keybar").classList.toggle("off", !cb.checked);
    try{ localStorage.setItem("vd_keybar", cb.checked ? "1" : "0"); }catch(e){}
  });
  lab.appendChild(cb); lab.appendChild(document.createTextNode("하단 키 안내 보기"));
  row2.appendChild(lab);

  var row3 = document.createElement("div"); row3.className = "row";
  var lab3 = document.createElement("label"); lab3.className = "tg";
  var cb3 = document.createElement("input"); cb3.type = "checkbox"; cb3.checked = true;
  cb3.addEventListener("change", function(){
    document.body.classList.toggle("zones", cb3.checked);
    try{ localStorage.setItem("vd_zones", cb3.checked ? "1" : "0"); }catch(e){}
  });
  lab3.appendChild(cb3); lab3.appendChild(document.createTextNode("연주 구역 표시 (라이드 벨 · 스네어 림 · 하이햇 페달)"));
  row3.appendChild(lab3);

  var hint = document.createElement("div"); hint.className = "hint";
  hint.innerHTML =
    "킥 <b>Space</b> · 스네어 헤드 <b>F</b> · 스네어 림/크로스스틱 <b>G</b><br>" +
    "하이 탐 <b>Z</b> · 미들 탐 <b>X</b> · 플로어 탐 <b>C</b><br>" +
    "하이햇 닫힘 <b>A</b> · 열림 <b>S</b> · 풋 페달 <b>D</b> (열린 소리를 바로 멈춤)<br>" +
    "크래시 1 <b>Q</b> · 크래시 2 <b>W</b> · 라이드 보우 <b>E</b> · 라이드 벨 <b>R</b>";
  menuVol.appendChild(row1); menuVol.appendChild(row2); menuVol.appendChild(row3); menuVol.appendChild(hint);
})();

document.getElementById("menuBtn").addEventListener("click", function(e){
  e.preventDefault(); e.stopPropagation();
  state.tab = "kick"; renderMenu();
  document.getElementById("menu").classList.add("on");
});
document.getElementById("menuClose").addEventListener("click", function(e){
  e.preventDefault(); e.stopPropagation();
  document.getElementById("menu").classList.remove("on");
});
document.getElementById("menu").addEventListener("pointerdown", function(e){ e.stopPropagation(); });

/* ---------- 시작 ---------- */
document.getElementById("startBtn").addEventListener("click", function(e){
  e.preventDefault(); e.stopPropagation();
  resumeAudio();
  document.getElementById("intro").classList.add("hide");
  setTimeout(alignLayers, 40);
  window.__vd.ready = true;
});
try{
  var sv = localStorage.getItem("vd_vol"); if(sv != null) state.vol = +sv;
  var sk = localStorage.getItem("vd_keybar");
  if(sk != null){ state.keybar = sk === "1"; document.getElementById("keybar").classList.toggle("off", !state.keybar); }
}catch(e){}

if(location.search.indexOf("slow") >= 0) document.documentElement.classList.add("slow");
try{ if(localStorage.getItem("vd_zones") !== "0") document.body.classList.add("zones"); }catch(e){ document.body.classList.add("zones"); }
buildSounds().catch(function(err){ window.__vd.errors.push("sound: " + (err && err.message ? err.message : err)); });
renderMenu();
window.addEventListener("load", function(){ setTimeout(alignLayers, 120); });
</script>
</body>
</html>
