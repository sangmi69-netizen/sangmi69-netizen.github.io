<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>gayageum 자체 점검</title>
<style>
  body{background:#111;color:#ddd;font:13px/1.5 monospace;margin:0;padding:12px}
  iframe{position:fixed;left:-2000px;top:0;width:844px;height:390px;border:0}
  pre{white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="fr"></iframe>
<pre id="out">running…</pre>
<script>
var out = document.getElementById('out');
var lines = [];
function log(s){ lines.push(s); out.textContent = lines.join('\n'); }

var fr = document.getElementById('fr');
fr.src = "./index.html?v=" + Date.now();
fr.addEventListener('load', function(){ setTimeout(run, 1600); });

function run(){
  var w = fr.contentWindow, d = fr.contentDocument;
  var A = w.__gaya;
  if(!A){ log('FAIL: __gaya 없음'); return; }
  log('errs: ' + JSON.stringify(w.__errs));
  log('build: ' + JSON.stringify(A.buildInfo()).slice(0, 160));

  var svg = d.getElementById('gaya');
  var b = svg.getBoundingClientRect();
  var st = A.state;
  var rot = A.layers.rot;
  function P(i, frac){
    // 모델 좌표 → 화면 좌표 (가로: 그대로 / 세로: -90 회전)
    var mx = st.W * frac, my = st.yTop + i * st.s;
    var sx, sy;
    if(rot === -90){ sx = my; sy = st.W - mx; }
    else { sx = mx; sy = my; }
    return { x: b.left + sx, y: b.top + sy };
  }
  function fire(type, x, y, id, target){
    var ev = new w.PointerEvent(type, {
      bubbles:true, cancelable:true, clientX:x, clientY:y,
      pointerId:id, pointerType:'touch', isPrimary:true, button:0, buttons:1
    });
    (target || w).dispatchEvent(ev);
  }

  // ── 1. 한 줄 뜯기 (5현)
  var n0 = A.log.length;
  var p5 = P(4, 0.78);
  fire('pointerdown', p5.x, p5.y, 11, svg);
  fire('pointerup', p5.x, p5.y, 11);
  var tap = A.log.slice(n0).map(function(e){ return e.i + 1; });
  log('tap 5현 → ' + JSON.stringify(tap));
  var vib1 = A.strings().filter(function(x){ return x.vib; }).map(function(x){ return x.i + 1; });
  log('진동(즉시) → ' + JSON.stringify(vib1));
  setTimeout(function(){
    var vib2 = A.strings().filter(function(x){ return x.vib; }).map(function(x){ return x.i + 1; });
    log('진동(200ms 뒤) → ' + JSON.stringify(vib2));
  }, 200);

  // ── 2~5. 훑기·멀티·농현 (20ms 간격)
  var seq = [];
  function step(fn, delay){ seq.push({fn:fn, t:delay}); }
  var tAcc = 0;
  function at(fn){ tAcc += 20; step(fn, tAcc); }

  at(function(){
    var n1 = A.log.length;
    w.__n1 = n1;
    var p0 = P(0, 0.78);
    fire('pointerdown', p0.x, p0.y, 21, svg);
  });
  for(var i = 1; i < 12; i++){
    (function(i){
      at(function(){ var pi = P(i, 0.78); fire('pointermove', pi.x, pi.y, 21); });
    })(i);
  }
  at(function(){
    var p11 = P(11, 0.78);
    fire('pointerup', p11.x, p11.y, 21);
    log('sweep 1→12 → ' + JSON.stringify(A.log.slice(w.__n1).map(function(e){ return e.i + 1; })));
  });

  // 역훑기
  at(function(){ w.__n2 = A.log.length; var q = P(11, 0.80); fire('pointerdown', q.x, q.y, 31, svg); });
  for(var j = 10; j >= 0; j--){
    (function(j){
      at(function(){ var pj = P(j, 0.80); fire('pointermove', pj.x, pj.y, 31); });
    })(j);
  }
  at(function(){
    var q0 = P(0, 0.80);
    fire('pointerup', q0.x, q0.y, 31);
    log('sweep 12→1 → ' + JSON.stringify(A.log.slice(w.__n2).map(function(e){ return e.i + 1; })));
  });

  // 멀티터치
  at(function(){
    w.__n3 = A.log.length;
    var m1 = P(2, 0.72), m2 = P(8, 0.72);
    fire('pointerdown', m1.x, m1.y, 41, svg);
    fire('pointerdown', m2.x, m2.y, 42, svg);
  });
  at(function(){
    var m1 = P(2, 0.72), m2 = P(8, 0.72);
    fire('pointerup', m1.x, m1.y, 41);
    fire('pointerup', m2.x, m2.y, 42);
    log('multi (3현+9현) → ' + JSON.stringify(A.log.slice(w.__n3).map(function(e){ return e.i + 1; })));
  });

  // 농현: 안족 왼쪽을 누르고 옆으로 흔들기
  at(function(){
    w.__n4 = A.log.length;
    var z = P(6, 0.22);
    w.__z = z;
    fire('pointerdown', z.x, z.y, 51, svg);
  });
  for(var k = 1; k <= 8; k++){
    (function(k){
      at(function(){
        var zp = P(6, 0.22 - k * 0.015);
        fire('pointermove', zp.x, zp.y + (k % 2 ? 7 : -7), 51);
      });
    })(k);
  }
  at(function(){
    var vs = A.voices();
    var list = vs.filter(function(x){ return x.i === 6; });
    var v = list[list.length - 1];
    try{
      log('농현 → 보이스 ' + JSON.stringify(v) + ' / 로그 ' + JSON.stringify(A.log.slice(w.__n4).map(function(e){ return e.i + 1; })));
    }catch(err){ log('농현 오류: ' + err.message); }
    fire('pointerup', w.__z.x, w.__z.y, 51);
  });

  var runAt = 0;
  seq.forEach(function(s){ setTimeout(s.fn, s.t); });

  // ── 6. 버퍼 상태
  var bufs = A.buffers();
  var rows = Object.keys(bufs).map(function(k){
    var b = bufs[k];
    return b.midi + ': ' + b.measured.toFixed(1) + 'Hz (' + b.cents.toFixed(2) + 'c) rms ' + b.rms.toFixed(3) + ' dur ' + b.dur.toFixed(2);
  });
  log('buffers ' + Object.keys(bufs).length + '\n  ' + rows.join('\n  '));

  // ── 7. 오프라인 렌더(체인 통과 후 실제 음량)
  setTimeout(function(){ var jobs = [0, 5, 11].map(function(i){
    return A.offlineTest(i, 1.2).then(function(r){
      return 'offline ' + (i + 1) + '현: peak ' + r.peak.toFixed(3) + ' rms ' + r.rms.toFixed(4) + ' f0 ' + r.measured.toFixed(1) + '/' + r.freq.toFixed(1);
    }).catch(function(e){ return 'offline ' + (i + 1) + '현 실패: ' + e.message; });
  });
  Promise.all(jobs).then(function(res){
    res.forEach(log);
    log('audio: ' + JSON.stringify(A.audioState()));
    try{ log('voices now: ' + JSON.stringify(A.voices())); }catch(err){ log('voices 오류: '+err.message); }
    log('errs end: ' + JSON.stringify(w.__errs));
    log('DONE');
  }); }, 900);
}
</script>
</body>
</html>
