<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>timpani 화면 크기 확인(임시)</title>

  body{margin:0;background:#222;color:#eee;font:12px system-ui;display:flex;gap:14px;padding:10px;align-items:flex-start;flex-wrap:wrap}

  <div class="box"><p>iPhone 13 Pro 세로 390×844</p><iframe id="f1" src="index.html?m=portrait" width="390" height="844"></iframe></div>

  <div class="box"><p>가로 844×390</p><iframe id="f3" src="index.html?m=landscape" width="844" height="390"></iframe></div>
