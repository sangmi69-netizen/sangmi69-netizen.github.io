<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>아이폰 화면 확인</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;font-family:-apple-system,sans-serif}
  .wrap{display:flex;gap:22px;align-items:flex-start;justify-content:center;padding:14px}
  .dev{display:flex;flex-direction:column;gap:6px;align-items:center}
  .cap{color:#8b8b96;font-size:12px;letter-spacing:.04em}
  iframe{border:0;background:#000;display:block;border-radius:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="dev"><div class="cap">iPhone 390×844 · 세로</div>
    <iframe id="pf" width="390" height="844"></iframe></div>
  <div class="dev"><div class="cap">iPhone 844×390 · 가로</div>
    <iframe id="lf" width="844" height="390"></iframe></div>
</div>
<script>
  var t = "?t=" + Date.now();
  document.getElementById("pf").src = "index.html" + t + "&pv=p";
  document.getElementById("lf").src = "index.html" + t + "&pv=l";
</script>
</body>
</html>
