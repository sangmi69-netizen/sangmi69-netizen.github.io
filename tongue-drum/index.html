<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#150a2c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%234a2f92'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23d9cdf5' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f2d59a'/%3E%3C/svg%3E" />
<title>보라색 텅드럼 — C key 15음 (공령고)</title>
<style>
  :root{
    --gold:#f4d9a0;
    --gold-dim:#c9a45f;
    --ink:#f3ecff;
    --ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    --serif:Georgia,"Times New Roman","Nanum Myeongjo",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;margin:0;overflow:hidden;background:#0b0518;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  body{font-family:var(--ui);color:var(--ink)}
  #app{
    position:fixed;inset:0;touch-action:none;
    background:
      radial-gradient(58% 46% at 50% 40%, rgba(126,88,229,.30) 0%, rgba(74,47,146,.16) 42%, rgba(11,5,24,0) 74%),
      radial-gradient(120% 100% at 50% 40%, #1d1040 0%, #150a2c 45%, #08030f 100%);
    display:grid;place-items:center;
  }
  /* 바닥 그림자 */
  #floor{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(96vw,94vh);aspect-ratio:1/1;border-radius:50%;
    box-shadow:0 26px 70px -18px rgba(0,0,0,.85), 0 0 120px rgba(124,84,222,.20);
    pointer-events:none;
  }
  #stage{
    position:relative;width:min(94vw,90vh);aspect-ratio:1/1;
    display:grid;place-items:center;touch-action:none;
  }
  #drum{
    width:100%;height:100%;display:block;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  #drum .key{touch-action:none}
  #drum text{pointer-events:none}

  /* ── 좌상단 배지 ── */
  #badge{
    position:absolute;left:0;top:0;z-index:5;pointer-events:none;
    padding:calc(10px + env(safe-area-inset-top)) 0 0 calc(12px + env(safe-area-inset-left));
  }
  #badge span{
    display:inline-block;font-size:12.5px;letter-spacing:.02em;font-weight:600;
    color:#f7e7c4;padding:5px 11px;border-radius:999px;
    background:linear-gradient(180deg, rgba(58,36,110,.86), rgba(32,18,66,.86));
    border:1px solid rgba(244,217,160,.42);
    box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    white-space:nowrap;
  }

  /* ── 표시 메뉴 ── */
  #ui{
    position:absolute;right:0;top:0;z-index:7;
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 0;
    display:flex;flex-direction:column;align-items:flex-end;gap:8px;
  }
  #menuBtn{
    font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.03em;color:#efe6ff;
    padding:7px 13px;border-radius:999px;cursor:pointer;
    background:linear-gradient(180deg, rgba(84,54,158,.92), rgba(44,25,92,.92));
    border:1px solid rgba(196,170,255,.45);
    box-shadow:0 4px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  #menuBtn:active{transform:translateY(1px)}
  #menu{
    display:none;min-width:170px;padding:6px;border-radius:14px;
    background:rgba(26,15,52,.94);
    border:1px solid rgba(196,170,255,.28);
    box-shadow:0 14px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  #menu.open{display:block}
  #menu .lbl{font-size:10.5px;letter-spacing:.12em;color:#9d8dc6;padding:5px 10px 6px;font-weight:700}
  #menu button{
    display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:13px;color:#e8dfff;text-align:left;cursor:pointer;
    padding:9px 10px;border-radius:9px;border:0;background:transparent;
  }
  #menu button:hover{background:rgba(140,110,230,.20)}
  #menu button .tick{color:#f4d9a0;opacity:0;font-size:12px}
  #menu button.on{background:rgba(140,110,230,.26);color:#fff}
  #menu button.on .tick{opacity:1}

  /* ── 힌트 ── */
  #hint{
    position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:4;font-size:11.5px;color:rgba(226,213,255,.62);text-align:center;
    letter-spacing:.01em;pointer-events:none;white-space:nowrap;
    transition:opacity .8s ease;padding:0 10px;
  }
  #hint.gone{opacity:0}

  /* ── 시작 커버 ── */
  #cover{
    position:absolute;inset:0;z-index:20;display:grid;place-items:center;
    background:radial-gradient(60% 50% at 50% 45%, rgba(30,15,62,.62) 0%, rgba(8,3,16,.88) 100%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    touch-action:none;cursor:pointer;transition:opacity .45s ease;
  }
  #cover.hide{opacity:0;pointer-events:none}
  #cover .box{text-align:center;transform:translateY(-2%)}
  #cover .kicker{
    font-size:10.5px;letter-spacing:.34em;color:rgba(200,180,255,.7);margin-bottom:14px;font-weight:700;
  }
  #cover h1{
    margin:0 0 6px;font-size:clamp(23px,6.4vmin,40px);font-weight:800;letter-spacing:-.01em;
    background:linear-gradient(180deg,#fff 0%,#d7c6ff 52%,#a98bf0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(150,110,255,.35);
  }
  #cover h2{
    margin:0 0 26px;font-size:clamp(11.5px,2.6vmin,14px);font-weight:600;color:rgba(213,197,255,.78);letter-spacing:.06em;
  }
  #cover .go{
    display:inline-flex;align-items:center;gap:9px;
    font-size:clamp(13px,3vmin,15px);font-weight:800;letter-spacing:.02em;color:#22123f;
    padding:13px 30px;border-radius:999px;
    background:linear-gradient(180deg,#fdf3da,#efd49b 55%,#d8b26a);
    box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.35) inset;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.35) inset}50%{transform:scale(1.035);box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.5) inset,0 0 34px rgba(240,212,155,.35)}}
  #cover .sub{margin-top:16px;font-size:11.5px;color:rgba(196,178,234,.6)}
</style>
</head>
<body>
<div id="app">
  <div id="floor"></div>
  <div id="stage">
    <svg id="drum" viewBox="-560 -560 1120 1120" aria-label="보라색 C key 15음 텅드럼">
      <defs>
        <radialGradient id="faceG" cx="42%" cy="34%" r="76%">
          <stop offset="0%"  stop-color="#8f74de"/>
          <stop offset="34%" stop-color="#6d51c4"/>
          <stop offset="66%" stop-color="#4c3198"/>
          <stop offset="88%" stop-color="#3a2478"/>
          <stop offset="100%" stop-color="#2c1a5e"/>
        </radialGradient>
        <radialGradient id="bodyG" cx="50%" cy="42%" r="60%">
          <stop offset="0%" stop-color="#7a5fd0"/>
          <stop offset="62%" stop-color="#432c8a"/>
          <stop offset="100%" stop-color="#1d1038"/>
        </radialGradient>
        <radialGradient id="tongueG" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="#a68cf3"/>
          <stop offset="55%" stop-color="#8769dd"/>
          <stop offset="100%" stop-color="#6a4bc0"/>
        </radialGradient>
        <linearGradient id="tongueLin" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"  stop-color="#b7a1f8"/>
          <stop offset="46%" stop-color="#8e70e4"/>
          <stop offset="100%" stop-color="#5f42b4"/>
        </linearGradient>
        <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
          <stop offset="60%" stop-color="#e6d9ff" stop-opacity=".13"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ropeG" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%"  stop-color="#e3daf6"/>
          <stop offset="38%" stop-color="#c3b6de"/>
          <stop offset="72%" stop-color="#9a8cbb"/>
          <stop offset="100%" stop-color="#6e6091"/>
        </linearGradient>
        <linearGradient id="goldG" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0%"  stop-color="#fff3d2"/>
          <stop offset="42%" stop-color="#f0d193"/>
          <stop offset="72%" stop-color="#c99c56"/>
          <stop offset="100%" stop-color="#a97f3f"/>
        </linearGradient>
        <radialGradient id="coreShade" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2a1a5c" stop-opacity=".0"/>
          <stop offset="70%" stop-color="#1a0f3c" stop-opacity=".18"/>
          <stop offset="100%" stop-color="#0d0620" stop-opacity=".55"/>
        </radialGradient>
        <filter id="glowF" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="9" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
        </filter>
        <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#05010c" flood-opacity=".62"/>
        </filter>
        <pattern id="brushed" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
          <rect width="6" height="6" fill="none"/>
          <line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
          <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-opacity=".05" stroke-width="1"/>
        </pattern>
        <pattern id="braid" width="34" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
          <rect width="34" height="26" fill="none"/>
          <path d="M0 0 q8.5 6.5 17 0 q8.5 6.5 17 0" fill="none" stroke="#6b5c8e" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
          <path d="M0 13 q8.5 6.5 17 0 q8.5 6.5 17 0" fill="none" stroke="#f2ecff" stroke-opacity=".5" stroke-width="3.4" stroke-linecap="round"/>
        </pattern>
      </defs>
      <g id="shell"></g>
      <g id="keys"></g>
    </svg>
  </div>

  <div id="badge"><span>창일중학교 이상미</span></div>

  <div id="ui">
    <button id="menuBtn" aria-haspopup="true" aria-expanded="false">표시 ▾</button>
    <div id="menu" role="menu">
      <div class="lbl">혀에 표시할 이름</div>
      <button data-mode="num"   role="menuitem">숫자 + 옥타브점 <span class="tick">✓</span></button>
      <button data-mode="photo" role="menuitem">숫자만 (사진처럼) <span class="tick">✓</span></button>
      <button data-mode="sol"   role="menuitem">계이름 (도레미) <span class="tick">✓</span></button>
      <button data-mode="nam"   role="menuitem">음이름 (C D E) <span class="tick">✓</span></button>
    </div>
  </div>

  <div id="hint">두 손가락으로 여러 음을 함께 칠 수 있어요 · 소리는 첫 터치에 켜집니다</div>

  <div id="cover">
    <div class="box">
      <div class="kicker">STEEL TONGUE DRUM</div>
      <h1>보라색 텅드럼</h1>
      <h2>C key · 15음 · 공령고 (E3 – E5)</h2>
      <div class="go">탭하여 시작</div>
      <div class="sub">말렛 없이 손가락으로 두드려도 됩니다</div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* 오류 수집(확인용) */
window.__errs = [];
window.addEventListener("error", function(e){ window.__errs.push(String(e.message||e)); });
window.addEventListener("unhandledrejection", function(e){ window.__errs.push("rejection:"+String(e.reason)); });

/* ══════════════════════════════════════════════════════════════
   1. 악기 배치 — 사진(IMG_1074)의 15음 배열
   · 가운데 큰 혀 = 3 (미, 가장 낮은 음 E3)
   · 둘레 14혀는 12시부터 시계방향으로 3,3,1,1,6,6,4,4,5,5,7,7,2,2
   · 같은 숫자가 이웃한 두 혀: 짧은 혀 = 한 옥타브 위, 긴 혀 = 아래
   ══════════════════════════════════════════════════════════════ */
var A4 = 440;
function hz(semi){ return A4 * Math.pow(2, semi/12); }          // A4 기준 반음 거리
var E3 = hz(-5), F3 = hz(-4), G3 = hz(-2), A3 = hz(0), B3 = hz(2),
    C4 = hz(3),  D4 = hz(5),  E4 = hz(7),  F4 = hz(8), G4 = hz(10),
    A4v = hz(12), B4 = hz(14), C5 = hz(15), D5 = hz(17), E5 = hz(19);

/* deg: 계이름 숫자, oct: 4=가온(점 없음), 3=아래점, 5=위점 */
var CORE = { deg:"3", sol:"미", name:"E", oct:3, freq:E3, kind:"core" };

/* 12시부터 시계방향. kind:"short" = 짧은 혀(위 옥타브), "long" = 긴 혀(아래 옥타브) */
var RING = [
  { deg:"3", sol:"미", name:"E", oct:5, freq:E5,  kind:"short" },
  { deg:"3", sol:"미", name:"E", oct:4, freq:E4,  kind:"long"  },
  { deg:"1", sol:"도", name:"C", oct:5, freq:C5,  kind:"short" },
  { deg:"1", sol:"도", name:"C", oct:4, freq:C4,  kind:"long"  },
  { deg:"6", sol:"라", name:"A", oct:4, freq:A4v, kind:"short" },
  { deg:"6", sol:"라", name:"A", oct:3, freq:A3,  kind:"long"  },
  { deg:"4", sol:"파", name:"F", oct:4, freq:F4,  kind:"short" },
  { deg:"4", sol:"파", name:"F", oct:3, freq:F3,  kind:"long"  },
  { deg:"5", sol:"솔", name:"G", oct:4, freq:G4,  kind:"short" },
  { deg:"5", sol:"솔", name:"G", oct:3, freq:G3,  kind:"long"  },
  { deg:"7", sol:"시", name:"B", oct:4, freq:B4,  kind:"short" },
  { deg:"7", sol:"시", name:"B", oct:3, freq:B3,  kind:"long"  },
  { deg:"2", sol:"레", name:"D", oct:5, freq:D5,  kind:"short" },
  { deg:"2", sol:"레", name:"D", oct:4, freq:D4,  kind:"long"  }
];

var NOTES = [];
NOTES.push({ idx:0, angle:0, core:true, deg:CORE.deg, sol:CORE.sol, name:CORE.name, oct:CORE.oct,
             freq:CORE.freq, kind:"core", key:"a" });
RING.forEach(function(n,i){
  NOTES.push({ idx:i+1, angle:i*360/RING.length, core:false, deg:n.deg, sol:n.sol, name:n.name,
               oct:n.oct, freq:n.freq, kind:n.kind, key:null });
});

/* ══════════════════════════════════════════════════════════════
   2. 텅드럼 그리기
   ══════════════════════════════════════════════════════════════ */
var NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  var e = document.createElementNS(NS, tag);
  if(attrs) for(var k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k, attrs[k]); }
  if(parent) parent.appendChild(e);
  return e;
}

var FACE_R   = 430;   // 상판 반지름
var RIM_OUT  = 502;   // 테두리(땋은 링) 바깥
var ARM_R    = 428;   // 혀의 두 갈래가 시작되는 반지름(상판 가장자리)
var LONG     = { tip:236, hw:57, fs:45, labelPad:44 };
var SHORT    = { tip:331, hw:42, fs:37, labelPad:38 };
var CORE_G   = { hw:88, tip:112, arm:-158, fs:60 };

/* 혀 모양: 국부좌표에서 -y 가 바깥(테두리), +y 가 안쪽(중심) */
function tonguePath(tip, hw, arm){
  return "M " + (-hw) + " " + arm +
         " L " + (-hw) + " " + tip +
         " A " + hw + " " + hw + " 0 0 0 " + hw + " " + tip +
         " L " + hw + " " + arm + " Z";
}

var shell = document.getElementById("shell");
var keysG = document.getElementById("keys");

/* ── 몸통 ── */
el("circle", {cx:0, cy:0, r:RIM_OUT+18, fill:"#120827", opacity:".9"}, shell);
el("circle", {cx:0, cy:0, r:RIM_OUT+2,  fill:"url(#bodyG)", filter:"url(#softShadow)"}, shell);
/* 땋은 테두리 링 */
el("circle", {cx:0, cy:0, r:(FACE_R+RIM_OUT)/2, fill:"none",
              stroke:"url(#ropeG)", "stroke-width":(RIM_OUT-FACE_R)}, shell);
el("circle", {cx:0, cy:0, r:(FACE_R+RIM_OUT)/2, fill:"none",
              stroke:"url(#braid)", "stroke-width":(RIM_OUT-FACE_R)}, shell);
el("circle", {cx:0, cy:0, r:FACE_R+3, fill:"none", stroke:"#2a1a55", "stroke-width":5, opacity:".85"}, shell);
el("circle", {cx:0, cy:0, r:RIM_OUT,   fill:"none", stroke:"#0e0620", "stroke-width":6, opacity:".9"}, shell);
el("circle", {cx:0, cy:0, r:RIM_OUT-7, fill:"none", stroke:"#efe8ff", "stroke-width":1.6, opacity:".30"}, shell);
/* 상판 */
el("circle", {cx:0, cy:0, r:FACE_R, fill:"url(#faceG)"}, shell);
el("circle", {cx:0, cy:0, r:FACE_R, fill:"url(#brushed)"}, shell);
el("ellipse",{cx:-150, cy:-225, rx:330, ry:215, fill:"url(#sheen)", opacity:".34", transform:"rotate(-24 -150 -225)"}, shell);
el("ellipse",{cx:170, cy:250, rx:280, ry:190, fill:"url(#sheen)", opacity:".13", transform:"rotate(-24 170 250)"}, shell);
el("circle", {cx:0, cy:0, r:FACE_R, fill:"url(#coreShade)"}, shell);
/* 상판 위 얕은 원형 홈 */
[410, 300, 196].forEach(function(r){
  el("circle",{cx:0,cy:0,r:r,fill:"none",stroke:"#ffffff","stroke-opacity":".055","stroke-width":1.4},shell);
});

/* ── 혀 그리기 ── */
var keyEls = [];   // {note, plate, glow, label, group}

function drawKey(note){
  var g = el("g", {transform:"rotate(" + note.angle + ")", class:"keygrp"}, keysG);
  var path, tip, hw, fs, labelY;

  if(note.core){
    /* 가운데 큰 혀: 갈래가 위(바깥)로, 둥근 끝이 아래(중심)로 */
    path = tonguePath(CORE_G.tip, CORE_G.hw, CORE_G.arm);
    fs = CORE_G.fs;
    labelY = -92;                   /* 둥근 끝과 갈래 사이 */
  }else{
    var cfg = note.kind === "long" ? LONG : SHORT;
    path = tonguePath(cfg.tip, cfg.hw, -ARM_R);
    fs = cfg.fs;
    labelY = cfg.tip + cfg.labelPad;
  }

  /* 홈(어두운 틈) */
  el("path", {d:path, fill:"none", stroke:"#0d0520", "stroke-width":11, opacity:".85", "stroke-linejoin":"round"}, g);
  /* 혀 판 */
  var plate = el("path", {d:path, fill:"url(#tongueLin)", stroke:"#2b1856", "stroke-width":3,
                          class:"plate", "data-i":note.idx}, g);
  /* 판의 안쪽 그늘 + 하이라이트 */
  el("path", {d:path, fill:"none", stroke:"#ffffff", "stroke-opacity":".30", "stroke-width":2.2,
              transform:"translate(0,-2)", opacity:".7"}, g);
  /* 빛남 */
  var glow = el("path", {d:path, fill:"#fff1c9", filter:"url(#glowF)", opacity:"0",
                          "pointer-events":"none"}, g);

  /* 이름표 */
  var lab = el("g", {transform:"translate(0," + labelY + ") rotate(180)"}, g);
  drawLabel(lab, note, fs);

  plate.addEventListener("pointerdown", onPointerDown, {passive:false});
  keyEls.push({note:note, plate:plate, glow:glow, labelGroup:lab, fs:fs});

  /* 가운데 혀 각인(도장) */
  if(note.core){
    var seal = el("g", {transform:"translate(0,26)", "pointer-events":"none"}, g);
    el("rect", {x:-44, y:-66, width:88, height:132, rx:9, fill:"#2a1a58", opacity:".55"}, seal);
    el("rect", {x:-44, y:-66, width:88, height:132, rx:9, fill:"none",
                stroke:"url(#goldG)", "stroke-width":2.4, opacity:".95"}, seal);
    ["텅","드","럼"].forEach(function(ch,i){
      el("text", {x:0, y:-30 + i*44, "text-anchor":"middle", "dominant-baseline":"middle",
                  "font-family":"Georgia, 'Times New Roman', serif", "font-size":30,
                  fill:"url(#goldG)", "letter-spacing":"1"}, seal).textContent = ch;
    });
  }
}

/* 이름표(숫자/계이름/음이름) */
var labelEls = [];
function drawLabel(parent, note, fs){
  var txt = el("text", {
    x:0, y:0, "text-anchor":"middle", "dominant-baseline":"central",
    "font-family":"Georgia, 'Times New Roman', serif",
    "font-size":fs, "font-weight":"600",
    fill:"url(#goldG)", "stroke":"#3a2a06", "stroke-width":".6", "stroke-opacity":".45",
    "letter-spacing":"0"
  }, parent);
  var dotUp = el("circle", {cx:0, cy:-(fs*0.86), r:Math.max(3, fs*0.085), fill:"url(#goldG)"}, parent);
  var dotDn = el("circle", {cx:0, cy: (fs*0.78), r:Math.max(3, fs*0.085), fill:"url(#goldG)"}, parent);
  labelEls.push({note:note, txt:txt, up:dotUp, dn:dotDn, fs:fs});
}

var LABEL_MODE = "num";
function applyLabels(){
  labelEls.forEach(function(L){
    var n = L.note, s = "", up = false, dn = false;
    if(LABEL_MODE === "num"){
      s = n.deg;
      up = n.oct === 5 || n.oct === 6;
      dn = n.oct === 3;
    }else if(LABEL_MODE === "photo"){
      s = n.deg;
    }else if(LABEL_MODE === "sol"){
      s = n.sol;
      up = n.oct === 5 || n.oct === 6;
      dn = n.oct === 3;
    }else{
      s = n.name + n.oct;
    }
    L.txt.textContent = s;
    L.txt.setAttribute("font-size", LABEL_MODE === "nam" ? L.fs*0.74 : L.fs);
    L.up.setAttribute("display", up ? "inline" : "none");
    L.dn.setAttribute("display", dn ? "inline" : "none");
  });
}

/* ══════════════════════════════════════════════════════════════
   3. 소리 — 스틸 텅드럼 합성 (Web Audio)
   ══════════════════════════════════════════════════════════════ */
var AC = { ctx:null, master:null, wet:null, conv:null, noise:null, ready:false };

function buildIR(ctx, seconds){
  var rate = ctx.sampleRate, len = Math.max(1, Math.floor(rate*seconds));
  var buf = ctx.createBuffer(2, len, rate);
  for(var ch=0; ch<2; ch++){
    var d = buf.getChannelData(ch);
    var last = 0;
    for(var i=0; i<len; i++){
      var t = i/len;
      var env = Math.pow(1-t, 2.35) * Math.exp(-t*2.05);
      var w = Math.random()*2 - 1;
      last = last*0.42 + w*0.58;            // 살짝 부드러운 잡음
      d[i] = last * env * 0.62;
    }
    /* 초기 반사음 */
    var taps = ch ? [0.011,0.019,0.031,0.047,0.061] : [0.013,0.023,0.036,0.052,0.068];
    for(var k=0;k<taps.length;k++){
      var idx = Math.floor(taps[k]*rate);
      if(idx < len) d[idx] += (k%2 ? -0.42 : 0.42) * Math.exp(-k*0.45);
    }
  }
  return buf;
}

function makeNoise(ctx, seconds){
  var rate = ctx.sampleRate, len = Math.max(1, Math.floor(rate*seconds));
  var buf = ctx.createBuffer(1, len, rate), d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  return buf;
}

function initAudio(){
  if(AC.ctx) return AC.ctx;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return null;
  var ctx = new Ctx({latencyHint:"interactive"});
  AC.ctx = ctx;

  var master = ctx.createGain();  master.gain.value = 0.86;
  var comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -15; comp.knee.value = 20; comp.ratio.value = 3.4;
  comp.attack.value = 0.004;  comp.release.value = 0.26;
  var lim = ctx.createDynamicsCompressor();
  lim.threshold.value = -2.2; lim.knee.value = 0; lim.ratio.value = 20;
  lim.attack.value = 0.001;   lim.release.value = 0.11;
  master.connect(comp); comp.connect(lim); lim.connect(ctx.destination);
  AC.master = master;

  var conv = ctx.createConvolver();
  conv.buffer = buildIR(ctx, 2.7);
  var wetHP = ctx.createBiquadFilter();
  wetHP.type = "highpass"; wetHP.frequency.value = 210;
  var wetGain = ctx.createGain(); wetGain.gain.value = 0.30;
  conv.connect(wetHP); wetHP.connect(wetGain); wetGain.connect(master);
  AC.wet = conv;

  AC.noise = makeNoise(ctx, 0.06);
  AC.ready = true;
  return ctx;
}

/* 한 음 — c: 컨텍스트, dest: 건조 출력, wet: 컨볼버(공간), noise: 말렛 잡음 버퍼 */
function makeVoice(c, dest, wet, freq, when, vel, noise){
  var t = when || c.currentTime;
  vel = (vel === undefined ? 1 : vel);
  var dur = Math.min(8.0, Math.max(2.7, 7.6 * Math.pow(170/freq, 0.46)));

  var head = c.createGain();          /* 음 하나의 버스 */
  head.gain.value = 0.9;
  head.connect(dest);
  if(wet){
    var send = c.createGain(); send.gain.value = 0.9;
    head.connect(send); send.connect(wet);
  }

  /* 배음: 기음 + 옥타브 + 12도 + 2옥타브 + 금속성 */
  var parts = [
    { r:1.000, a:1.00, d:1.00, det:0     },
    { r:1.000, a:0.26, d:0.86, det:5.5   },   /* 살짝 어긋난 쌍 — 맥놀이 */
    { r:2.000, a:0.34, d:0.56, det:-3.0  },
    { r:3.020, a:0.13, d:0.33, det:2.0   },
    { r:4.090, a:0.062,d:0.22, det:-2.0  },
    { r:5.470, a:0.030,d:0.14, det:1.5   }
  ];
  var tEnd = t + dur;

  for(var i=0;i<parts.length;i++){
    var p = parts[i];
    var o = c.createOscillator();
    o.type = "sine";
    var f = freq * p.r;
    o.frequency.setValueAtTime(f * (p.r === 1 ? 1.006 : 1.0), t);
    if(p.r === 1) o.frequency.exponentialRampToValueAtTime(f, t + 0.075);
    if(p.det) o.detune.setValueAtTime(p.det, t);
    var g = c.createGain();
    var peak = p.a * vel * 0.5;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.004);
    g.gain.exponentialRampToValueAtTime(Math.max(0.00008, peak*0.30), t + Math.min(0.9, dur*0.16));
    g.gain.exponentialRampToValueAtTime(0.00006, t + dur*p.d);
    o.connect(g); g.connect(head);
    o.start(t);
    o.stop(t + dur*p.d + 0.06);
  }

  /* 말렛 어택 — 아주 짧은 잡음 */
  if(noise){
    var n = c.createBufferSource(); n.buffer = noise;
    var bp = c.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = Math.min(4200, freq*4.2); bp.Q.value = 0.85;
    var ng = c.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.linearRampToValueAtTime(0.11*vel, t+0.002);
    ng.gain.exponentialRampToValueAtTime(0.00005, t+0.055);
    n.connect(bp); bp.connect(ng); ng.connect(head);
    n.start(t); n.stop(t+0.08);
  }
  return { end: tEnd };
}

/* 울림 방출 */
var activeVoices = 0;
function strike(note, vel, idxOverride){
  var ctx = AC.ctx || initAudio();
  if(!ctx) return null;
  if(ctx.state === "suspended") ctx.resume();
  var t = ctx.currentTime + 0.0005;
  if(activeVoices > 26) return null;   /* 안전 상한 */
  activeVoices++;
  makeVoice(ctx, AC.master, AC.wet, note.freq, t, vel === undefined ? 1 : vel, AC.noise);
  var life = Math.min(8.0, Math.max(2.7, 7.6*Math.pow(170/note.freq,0.46)));
  setTimeout(function(){ activeVoices = Math.max(0, activeVoices-1); }, life*1000);
  lastHit = { idx: note.idx, deg: note.deg, name: note.name + note.oct, freq: note.freq, t: Date.now() };
  return lastHit;
}
var lastHit = null;

/* ══════════════════════════════════════════════════════════════
   4. 터치/마우스
   ══════════════════════════════════════════════════════════════ */
var pointerSeen = Object.create(null);
var lastStrikeAt = 0;

function onPointerDown(ev){
  if(ev.pointerType === "mouse" && ev.button !== 0) return;
  ev.preventDefault();
  var key = ev.pointerId || 0;
  if(pointerSeen[key]) return;
  pointerSeen[key] = 1;
  var plate = ev.currentTarget;
  var idx = parseInt(plate.getAttribute("data-i"), 10);
  var note = NOTES[idx];
  hit(note);
}
["pointerup","pointercancel","pointerout"].forEach(function(t){
  document.addEventListener(t, function(ev){ delete pointerSeen[ev.pointerId || 0]; }, true);
});

function hit(note){
  strike(note, 1);
  var k = keyEls[note.idx];
  if(k){
    try{
      k.glow.animate([{opacity:".95"},{opacity:"0"}], {duration:820, easing:"cubic-bezier(.16,.7,.3,1)"});
      k.plate.animate([{filter:"brightness(1.45) saturate(1.15)"},{filter:"brightness(1)"}],
                      {duration:320, easing:"cubic-bezier(.2,.8,.3,1)"});
    }catch(e){ /* WAAPI 미지원 시 무시 */ }
  }
  lastStrikeAt = Date.now();
  hideHintSoon();
}

/* 확대·스크롤·새 창 방지 */
var lastTouchEnd = 0;
document.addEventListener("touchstart", function(e){
  if(e.touches && e.touches.length > 1 && e.cancelable) e.preventDefault();
}, {passive:false});
["gesturestart","gesturechange","gestureend"].forEach(function(t){
  document.addEventListener(t, function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});
});
document.addEventListener("touchend", function(e){
  var now = e.timeStamp || Date.now();
  if(now - lastTouchEnd < 320){ if(e.cancelable) e.preventDefault(); lastTouchEnd = 0; }
  else lastTouchEnd = now;
}, {passive:false});
document.addEventListener("dblclick", function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", function(e){ e.preventDefault(); }, {passive:false});

/* ══════════════════════════════════════════════════════════════
   5. 화면 구성 · 메뉴
   ══════════════════════════════════════════════════════════════ */
var menuBtn = document.getElementById("menuBtn");
var menu = document.getElementById("menu");
function setMenu(open){
  menu.classList.toggle("open", open);
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
}
menuBtn.addEventListener("click", function(e){
  e.stopPropagation();
  setMenu(!menu.classList.contains("open"));
});
menu.addEventListener("click", function(e){ e.stopPropagation(); });
document.addEventListener("pointerdown", function(e){
  if(menu.classList.contains("open") && !menu.contains(e.target) && e.target !== menuBtn) setMenu(false);
}, true);

function setMode(mode){
  LABEL_MODE = mode;
  applyLabels();
  Array.prototype.forEach.call(menu.querySelectorAll("button[data-mode]"), function(b){
    b.classList.toggle("on", b.getAttribute("data-mode") === mode);
  });
}
Array.prototype.forEach.call(menu.querySelectorAll("button[data-mode]"), function(b){
  b.addEventListener("click", function(){ setMode(b.getAttribute("data-mode")); setMenu(false); });
});

/* 시작 커버 — 첫 제스처에서 오디오 잠금 해제 */
var cover = document.getElementById("cover");
function unlock(){
  var ctx = initAudio();
  if(ctx && ctx.state !== "running" && ctx.resume) ctx.resume();
  cover.classList.add("hide");
  setTimeout(function(){ if(cover.parentNode) cover.parentNode.removeChild(cover); }, 520);
  hideHintSoon();
}
cover.addEventListener("pointerdown", function(e){ e.preventDefault(); unlock(); }, {passive:false});
cover.addEventListener("touchstart", function(e){ e.preventDefault(); unlock(); }, {passive:false});
cover.addEventListener("click", function(e){ e.preventDefault(); unlock(); });
window.addEventListener("keydown", function(){ if(!cover.classList.contains("hide")) unlock(); }, {once:false});

/* 데스크톱 키보드 */
var KEY_BY_NAME = {
  "1":"C4", "2":"D4", "3":"E4", "4":"F4", "5":"G4", "6":"A4", "7":"B4",
  "q":"C5", "w":"D5", "e":"E5",
  "a":"E3", "s":"F3", "d":"G3", "f":"A3", "g":"B3"
};
var NAME_TO_NOTE = {};
NOTES.forEach(function(n){ NAME_TO_NOTE[n.name + n.oct] = n; });

window.addEventListener("keydown", function(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  var k = (e.key || "").toLowerCase();
  if(KEY_BY_NAME[k]){
    e.preventDefault();
    if(!cover.classList.contains("hide")) unlock();
    var n = NAME_TO_NOTE[KEY_BY_NAME[k]];
    if(n) hit(n);
  }
});

/* 힌트 */
var hint = document.getElementById("hint");
var hintTimer = null;
function hideHintSoon(){
  if(hintTimer) return;
  hintTimer = setTimeout(function(){ hint.classList.add("gone"); }, 6000);
}
setTimeout(function(){ hint.classList.add("gone"); }, 16000);

/* 크기 조정 */
function layout(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var land = vw > vh;
  var size = Math.min(vw * (land ? 0.98 : 0.94), vh * (land ? 0.94 : 0.86));
  var stage = document.getElementById("stage");
  stage.style.width = size + "px";
  stage.style.height = size + "px";
  var floor = document.getElementById("floor");
  floor.style.width = (size * 1.02) + "px";
  floor.style.height = (size * 1.02) + "px";
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", function(){ setTimeout(layout, 120); });

/* ── 실행 ── */
drawKey(NOTES[0]);
for(var i=1;i<NOTES.length;i++) drawKey(NOTES[i]);
setMode("num");
layout();

/* 확인용 공개 API (테스트 하네스에서 사용) */
window.__td = {
  notes: NOTES,
  makeVoice: makeVoice,
  buildIR: buildIR,
  makeNoise: makeNoise,
  strike: strike,
  hit: hit,
  ctx: function(){ return AC.ctx; },
  ready: function(){ return AC.ready; },
  last: function(){ return lastHit; },
  unlock: unlock
};
})();
</script>
</body>
