<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팀파니 화면 확인</title>
<style>
  body{margin:0;background:#202020;font-family:sans-serif;color:#ddd;padding:16px}
  h1{font-size:14px;margin:0 0 10px;font-weight:600;color:#aaa}
  .row{display:flex;gap:18px;align-items:flex-start;flex-wrap:nowrap}
  .box{background:#000;border:1px solid #444;border-radius:8px;overflow:hidden}
  .cap{font-size:12px;color:#888;margin:6px 0 4px}
  iframe{border:0;display:block;background:#000}
</style>
</head>
<body>
<h1>온라인 팀파니 — 실제 배포 주소를 휴대폰 크기 틀에 넣어 확인</h1>
<div class="row">
  <div>
    <div class="cap">휴대폰 가로 844 × 390</div>
    <div class="box"><iframe id="landscape" src="https://sangmi69-netizen.github.io/timpani/?frame=1&v=3" width="844" height="390"></iframe></div>
  </div>
  <div>
    <div class="cap">휴대폰 세로 390 × 844</div>
    <div class="box"><iframe id="portrait" src="https://sangmi69-netizen.github.io/timpani/?frame=2&v=3" width="390" height="844"></iframe></div>
  </div>
  <div>
    <div class="cap">작은 노트북 1024 × 640</div>
    <div class="box"><iframe id="small" src="https://sangmi69-netizen.github.io/timpani/?frame=3&v=3" width="1024" height="640"></iframe></div>
  </div>
</div>
</body>
</html>
